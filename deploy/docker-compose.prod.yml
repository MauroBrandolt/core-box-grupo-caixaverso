services:
  core-box:
    image: ${IMAGEM:?A variavel IMAGEM com digest e obrigatoria}
    container_name: core-box
    restart: unless-stopped

    env_file:
      - core-box.env

    ports:
      - "80:8000"

    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:8000/health",
          timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
