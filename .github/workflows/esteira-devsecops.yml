name: Esteira DevSecOps - Core Box

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# MODO AUDITORIA.
# No Lab 2, mudar para "false" para ativar os gates.
env:
  MODO_AUDITORIA: "false"

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: "1. Gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Gitleaks
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:v8.24.2
          mkdir -p "$RUNNER_TEMP/gitleaks"

      # MODO AUDITORIA
      - name: Analisar segredos no historico
        continue-on-error: ${{ env.MODO_AUDITORIA == 'true' }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/codigo \
            -v "$GITHUB_WORKSPACE:/codigo:ro" \
            -v "$RUNNER_TEMP/gitleaks:/relatorios" \
            -w /codigo \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git /codigo \
            --log-opts="--all" \
            --baseline-path=/codigo/.gitleaks-baseline.json \
            --redact \
            --report-format=json \
            --report-path=/relatorios/gitleaks.json \
            --exit-code=1

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-gitleaks
          path: ${{ runner.temp }}/gitleaks/gitleaks.json
          if-no-files-found: error

  semgrep:
    name: "2. Semgrep"
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Semgrep
        run: |
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" \
            -m pip install "semgrep==1.184.0"

      # MODO AUDITORIA
      - name: Analisar codigo
        continue-on-error: ${{ env.MODO_AUDITORIA == 'true' }}
        run: |
          CONFIGS=(--config p/python --config p/security-audit)

          if [ -d .semgrep ] && \
             find .semgrep -type f \
               \( -name '*.yml' -o -name '*.yaml' \) | grep -q .; then
            CONFIGS+=(--config .semgrep)
          fi

          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            "${CONFIGS[@]}" \
            --error \
            --metrics=off \
            --exclude .venv \
            --json \
            --output semgrep.json \
            .

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-semgrep
          path: semgrep.json
          if-no-files-found: error

  build_testes:
    name: "3. Build e testes"
    needs: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias originais
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      # MODO AUDITORIA
      - name: Executar testes
        continue-on-error: ${{ env.MODO_AUDITORIA == 'true' }}
        run: |
          export BOX_SECRET_KEY="$(openssl rand -hex 32)"
          export BOX_JWT_SECRET="$(openssl rand -hex 32)"
          export BOX_PSTI_API_KEY="$(openssl rand -hex 32)"
          export BOX_SMS_GATEWAY_TOKEN="$(openssl rand -hex 32)"
          .venv/bin/python -m pytest -v --junitxml=junit.xml

      - name: Empacotar codigo e verificar SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/core-box-build"

          git archive \
            --format=tar.gz \
            --output="$RUNNER_TEMP/core-box-build/core-box.tar.gz" \
            HEAD

          cd "$RUNNER_TEMP/core-box-build"
          sha256sum core-box.tar.gz > core-box.tar.gz.sha256
          sha256sum --check core-box.tar.gz.sha256

      - name: Publicar pacote e testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-03-build
          path: |
            junit.xml
            ${{ runner.temp }}/core-box-build/core-box.tar.gz
            ${{ runner.temp }}/core-box-build/core-box.tar.gz.sha256
          if-no-files-found: error

  trivy_fs:
    name: "4. Trivy filesystem e SBOM"
    needs: build_testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Gerar relatorio completo
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .venv,.git
          format: json
          output: trivy-fs.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Gerar SBOM CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: .venv,.git
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      # MODO AUDITORIA
      - name: Gate HIGH e CRITICAL com correcao disponivel
        continue-on-error: ${{ env.MODO_AUDITORIA == 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          skip-dirs: .venv,.git
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-04-trivy-sca
          path: |
            trivy-fs.json
            sbom.cdx.json
          if-no-files-found: error

  docker:
    name: "5. Docker e GHCR"
    needs: trivy_fs

    # Publicacao apenas para branches do proprio repositorio.
    # PRs de forks nao recebem permissao de publicacao.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write

    outputs:
      imagem: ${{ steps.imagem.outputs.nome }}
      digest: ${{ steps.build.outputs.digest }}
      referencia: ${{ steps.referencia.outputs.valor }}

    steps:
      - uses: actions/checkout@v4

      - name: Definir nome e tag
        id: imagem
        run: |
          REPOSITORIO="${GITHUB_REPOSITORY,,}"
          echo "nome=ghcr.io/${REPOSITORIO}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Preparar contexto limpo do commit
        run: |
          mkdir -p "$RUNNER_TEMP/docker-context"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/docker-context"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/docker-context
          push: true
          tags: ${{ steps.imagem.outputs.nome }}:${{ steps.imagem.outputs.tag }}

      - name: Registrar imagem e digest
        id: referencia
        env:
          IMAGEM: ${{ steps.imagem.outputs.nome }}
          TAG: ${{ steps.imagem.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          printf '%s:%s\n' "$IMAGEM" "$TAG" > imagem-tag.txt
          printf '%s@%s\n' "$IMAGEM" "$DIGEST" > imagem-digest.txt
          echo "valor=${IMAGEM}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Publicar identificacao da imagem
        uses: actions/upload-artifact@v4
        with:
          name: docker-build
          path: |
            imagem-tag.txt
            imagem-digest.txt
          if-no-files-found: error

  trivy_imagem:
    name: "6. Trivy imagem"
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    steps:
      - name: Gerar relatorio completo da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.docker.outputs.referencia }}
          scanners: vuln
          format: json
          output: trivy-image.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # MODO AUDITORIA
      - name: Gate HIGH e CRITICAL com correcao disponivel
        continue-on-error: ${{ env.MODO_AUDITORIA == 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.docker.outputs.referencia }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image
          path: trivy-image.json
          if-no-files-found: error

  homologacao:
    name: "7. Homologacao e ZAP"
    needs: [docker, trivy_imagem]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir imagem e aguardar saude
        env:
          IMAGEM: ${{ needs.docker.outputs.referencia }}
        run: |
          docker pull "$IMAGEM"

          docker run -d \
            --name core-box-homolog \
            -e BOX_SECRET_KEY="$(openssl rand -hex 32)" \
            -e BOX_JWT_SECRET="$(openssl rand -hex 32)" \
            -e BOX_PSTI_API_KEY="$(openssl rand -hex 32)" \
            -e BOX_SMS_GATEWAY_TOKEN="$(openssl rand -hex 32)" \
            -p 127.0.0.1:8000:8000 \
            "$IMAGEM"

          for i in {1..30}; do
            if curl --fail --silent --max-time 5 \
              http://127.0.0.1:8000/health > /dev/null; then
              echo "Core Box saudavel"
              exit 0
            fi
            sleep 2
          done

          docker logs core-box-homolog
          exit 1

      - name: ZAP baseline informativo
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8000"
          fail_action: false
          allow_issue_writing: false
          artifact_name: homologacao-zap

      - name: Coletar logs
        if: always()
        run: |
          docker logs core-box-homolog > homologacao.log 2>&1 || true

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-logs
          path: homologacao.log
          if-no-files-found: error

      - name: Encerrar homologacao
        if: always()
        run: docker rm -f core-box-homolog || true


  producao:
    name: "8. Aprovacao manual e producao"
    needs:
      - docker
      - trivy_imagem
      - homologacao

    # Somente o merge/push na main pode solicitar deploy.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: producao
      url: http://${{ vars.PROD_HOST }}/login

    permissions:
      contents: read
      packages: read

    outputs:
      imagem: ${{ steps.deploy.outputs.imagem }}

    steps:
      - uses: actions/checkout@v4

      - name: Validar configuracao e digest
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          IMAGEM: ${{ needs.docker.outputs.referencia }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          BOX_SECRET_KEY: ${{ secrets.BOX_SECRET_KEY }}
          BOX_JWT_SECRET: ${{ secrets.BOX_JWT_SECRET }}
          BOX_PSTI_API_KEY: ${{ secrets.BOX_PSTI_API_KEY }}
          BOX_SMS_GATEWAY_TOKEN: ${{ secrets.BOX_SMS_GATEWAY_TOKEN }}
        run: |
          test -n "$PROD_HOST"
          test -n "$IMAGEM"
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_KNOWN_HOSTS"
          test -n "$BOX_SECRET_KEY"
          test -n "$BOX_JWT_SECRET"
          test -n "$BOX_PSTI_API_KEY"
          test -n "$BOX_SMS_GATEWAY_TOKEN"

          case "$IMAGEM" in
            *@sha256:*) ;;
            *)
              echo "Deploy recusado: imagem sem digest."
              exit 1
              ;;
          esac

      - name: Preparar SSH e variaveis protegidas
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          BOX_SECRET_KEY: ${{ secrets.BOX_SECRET_KEY }}
          BOX_JWT_SECRET: ${{ secrets.BOX_JWT_SECRET }}
          BOX_PSTI_API_KEY: ${{ secrets.BOX_PSTI_API_KEY }}
          BOX_SMS_GATEWAY_TOKEN: ${{ secrets.BOX_SMS_GATEWAY_TOKEN }}
        run: |
          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$PROD_SSH_KEY" \
            > "$HOME/.ssh/deploy_corebox"

          printf '%s\n' "$PROD_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 \
            "$HOME/.ssh/deploy_corebox" \
            "$HOME/.ssh/known_hosts"

          umask 077
          {
            printf 'BOX_AMBIENTE=producao\n'
            printf 'BOX_DATABASE=/app/data/box.db\n'
            printf 'BOX_UPLOAD_DIR=/app/uploads\n'
            printf 'BOX_SECRET_KEY=%s\n' "$BOX_SECRET_KEY"
            printf 'BOX_JWT_SECRET=%s\n' "$BOX_JWT_SECRET"
            printf 'BOX_PSTI_API_KEY=%s\n' "$BOX_PSTI_API_KEY"
            printf 'BOX_SMS_GATEWAY_TOKEN=%s\n' "$BOX_SMS_GATEWAY_TOKEN"
          } > "$RUNNER_TEMP/core-box.env"

      - name: Enviar arquivos para a VPS
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT || '8080' }}
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_corebox" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -p "$PROD_SSH_PORT" \
            "deploy@${PROD_HOST}" \
            'install -d -m 700 /opt/core-box'

          scp \
            -i "$HOME/.ssh/deploy_corebox" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -P "$PROD_SSH_PORT" \
            deploy/docker-compose.prod.yml \
            deploy/deploy.sh \
            "$RUNNER_TEMP/core-box.env" \
            "deploy@${PROD_HOST}:/opt/core-box/"

          ssh \
            -i "$HOME/.ssh/deploy_corebox" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -p "$PROD_SSH_PORT" \
            "deploy@${PROD_HOST}" \
            'chmod 750 /opt/core-box/deploy.sh &&
             chmod 600 /opt/core-box/core-box.env'

      - name: Implantar imagem aprovada
        id: deploy
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT || '8080' }}
          IMAGEM: ${{ needs.docker.outputs.referencia }}
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_corebox" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -p "$PROD_SSH_PORT" \
            "deploy@${PROD_HOST}" \
            "cd /opt/core-box &&
             IMAGEM='${IMAGEM}' ./deploy.sh"

          echo "imagem=$IMAGEM" >> "$GITHUB_OUTPUT"

      - name: Smoke test externo
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
        run: |
          for tentativa in {1..15}; do
            HEALTH="$(
              curl -s -o health.json -w '%{http_code}' \
                --max-time 5 \
                "http://${PROD_HOST}/health" || true
            )"

            LOGIN="$(
              curl -s -o login.html -w '%{http_code}' \
                --max-time 5 \
                "http://${PROD_HOST}/login" || true
            )"

            if [ "$HEALTH" = "200" ] &&
               [ "$LOGIN" = "200" ]; then
              grep -q \
                '"status"[[:space:]]*:[[:space:]]*"ok"' \
                health.json

              echo "Health: HTTP $HEALTH"
              echo "Login: HTTP $LOGIN"
              exit 0
            fi

            echo \
              "Tentativa $tentativa: health=$HEALTH login=$LOGIN"
            sleep 4
          done

          echo "Smoke test de producao falhou."
          exit 1

      - name: Registrar evidencia
        if: always()
        env:
          IMAGEM: ${{ needs.docker.outputs.referencia }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT || '8080' }}
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "resultado_job=${{ job.status }}"
            echo "imagem=${IMAGEM}"
            echo "destino=deploy@${PROD_HOST}:${PROD_SSH_PORT}"
            echo "diretorio=/opt/core-box"
            echo "environment=producao"
            echo "health=http://${PROD_HOST}/health"
            echo "login=http://${PROD_HOST}/login"
            echo "data_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > deploy-producao.txt

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-producao
          path: deploy-producao.txt
          if-no-files-found: error

      - name: Limpar material sensivel
        if: always()
        run: |
          rm -f \
            "$HOME/.ssh/deploy_corebox" \
            "$RUNNER_TEMP/core-box.env"

  resumo:
    name: Resumo da execucao
    if: always()
    needs:
      - gitleaks
      - semgrep
      - build_testes
      - trivy_fs
      - docker
      - trivy_imagem
      - homologacao
      - producao
    runs-on: ubuntu-latest

    steps:
      - name: Publicar resumo
        env:
          RESULTADOS: ${{ toJSON(needs) }}
          IMAGEM: ${{ needs.docker.outputs.referencia }}
        run: |
          python3 - <<'PY'
          import json
          import os

          resultados = json.loads(os.environ["RESULTADOS"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as resumo:
              resumo.write("# Core Box - resumo\n\n")
              resumo.write(
                  f"Modo auditoria: **{os.environ['MODO_AUDITORIA']}**\n\n"
              )
              resumo.write("| Job | Resultado |\n|---|---|\n")
              for nome, dados in resultados.items():
                  resumo.write(f"| {nome} | {dados['result']} |\n")
              resumo.write(
                  "\nEm auditoria, sucesso do job nao significa "
                  "ausencia de vulnerabilidades. Consulte os relatorios "
                  "e os passos com falhas toleradas.\n"
              )
              imagem = os.environ.get("IMAGEM", "")
              if imagem:
                  resumo.write(f"\nImagem analisada: `{imagem}`\n")
              producao = resultados.get("producao", {})
              resumo.write(
                  f"\nEtapa 8 - producao: "
                  f"**{producao.get('result', 'nao executada')}**\n"
              )
          PY
